[package]
name = "ytec-sticky-note-startup"
version = "1.5.3"
edition = "2024"
publish = false
build = "build.rs"
license = "Apache-2.0"
description = "罫彩をWindowsサインイン時に安全に待機起動する補助プログラム"
repository = "https://github.com/ytec-commits/ytec-sticky-note"

[package.metadata.winresource]
CompanyName = "Y-TEC"
FileDescription = "罫彩 Windows起動待機プログラム"
FileVersion = "1.5.3.0"
LegalCopyright = "Copyright © Y-TEC 2026"
OriginalFilename = "YTEC-Sticky-Note-Startup.exe"
ProductName = "罫彩"
ProductVersion = "1.5.3"

[build-dependencies]
winresource = { version = "0.1.31", default-features = false }

[[bin]]
name = "YTEC-Sticky-Note-Startup"
path = "src/main.rs"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
