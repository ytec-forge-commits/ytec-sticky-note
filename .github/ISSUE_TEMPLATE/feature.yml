name: 機能・改善提案
description: 罫彩をより使いやすくする提案です
title: "[Proposal] "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 解決したいこと
      description: どんな場面で困っているかを記載してください。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 希望する動作
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 代替案・補足
