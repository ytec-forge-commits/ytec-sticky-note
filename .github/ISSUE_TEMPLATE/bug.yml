name: 不具合報告
description: 罫彩の不具合を報告します
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: 付箋の本文、個人情報、職場の機密情報、実際の保存データは記載しないでください。
  - type: input
    id: version
    attributes:
      label: 罫彩のバージョン
      placeholder: 例 1.5.3
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windowsのバージョン
      placeholder: 例 Windows 11 24H2
    validations:
      required: true
  - type: input
    id: displays
    attributes:
      label: モニター構成
      placeholder: 例 2画面、外部125%、本体150%
  - type: textarea
    id: steps
    attributes:
      label: 再現手順
      description: 実際の付箋本文を使わずに再現できる手順を記載してください。
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期待した動作
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 実際の動作
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: 補足
      description: 実データを除いたスクリーンショットなどがあれば添付してください。
