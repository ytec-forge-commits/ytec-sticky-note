version: 2
updates:
  - package-ecosystem: nuget
    directory: /src/YtecStickyNote
    schedule:
      interval: weekly
      day: monday
      time: "03:00"
      timezone: Asia/Tokyo
    open-pull-requests-limit: 3
    labels: [dependencies]

  - package-ecosystem: cargo
    directory: /src/YtecStickyNote.Startup
    schedule:
      interval: weekly
      day: monday
      time: "03:15"
      timezone: Asia/Tokyo
    open-pull-requests-limit: 3
    labels: [dependencies]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "03:30"
      timezone: Asia/Tokyo
    open-pull-requests-limit: 3
    labels: [dependencies]
